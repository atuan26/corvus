name: Windows build

# Runs for pull requests, tags like v0.1.0, and by hand from the Actions tab.
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Builds the UI (beforeBuildCommand), the release binary, and the installers.
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis,msi

      - uses: actions/upload-artifact@v4
        with:
          name: corvus-windows
          # Setup .exe (NSIS), .msi, and the bare app .exe, which runs without installing.
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/corvus-app.exe
          if-no-files-found: error

      # After the upload, so a Windows-only test failure still leaves the downloads available.
      - run: cargo test -p corvus-core -p corvus-ai -p corvus-cli
